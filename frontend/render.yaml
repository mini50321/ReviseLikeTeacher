services:
  - type: web
    name: reviseliketeacher-frontend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://reviseliketeacher-backend.onrender.com/api
      - key: NODE_ENV
        value: production
    healthCheckPath: /

