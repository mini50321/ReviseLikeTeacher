services:
  - type: web
    name: reviseliketeacher-ai-service
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PORT
        fromService:
          type: web
          name: reviseliketeacher-ai-service
          property: port
      - key: OPENAI_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
    healthCheckPath: /health

