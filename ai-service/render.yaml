services:
  - type: web
    name: reviseliketeacher-ai-service
    env: python
    buildCommand: pip install --upgrade pip && pip install --upgrade setuptools wheel build && pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PORT
        fromService:
          type: web
          name: reviseliketeacher-ai-service
          property: port
      - key: OPENAI_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: PDF_MAX_TEXT_CHARS
        value: 180000
      - key: PDF_MAX_PAGES
        value: 250
    healthCheckPath: /health

