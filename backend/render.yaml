services:
  - type: web
    name: reviseliketeacher-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: AI_SERVICE_URL
        value: https://reviseliketeacher-ai-service.onrender.com
    healthCheckPath: /health

